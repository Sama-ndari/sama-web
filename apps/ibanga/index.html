<!DOCTYPE html>
<html lang="en">
<head>
  <style id="sama-gate-boot">html.sama-gate-checking body{visibility:hidden!important}html.sama-gate-blocked body>*:not(#sama-access-gate){display:none!important}</style>
  <script src="../../assets/js/access-gate.js"></script>
<meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>IBANGA • Privacy-first web experience</title>
  <meta name="description" content="Minimal, privacy-forward web experience." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="IBANGA" />
  <meta property="og:description" content="Privacy-first web experience." />
  <meta property="og:image" content="https://web.samandari.dev/assets/apps/ibanga/icon.webp" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:url" content="https://web.samandari.dev/apps/ibanga/" />
  <meta property="og:site_name" content="Sama Web" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="IBANGA" />
  <script>
    (function () {
      var target = "https://www.ibanga.samandari.dev/";
      var html = document.documentElement;
      function tryRedirect() {
        if (html.classList.contains("sama-gate-blocked")) return;
        if (html.classList.contains("sama-gate-checking")) {
          setTimeout(tryRedirect, 40);
          return;
        }
        window.location.replace(target);
      }
      tryRedirect();
    })();
  </script>
</head>
<body></body>
</html>
